#==keys
#--prefix
set -gq prefix C-f
bind C-f send-prefix
set -gq prefix2 C-l
bind C-l send-prefix -2
#-! alt key?
# bind -n M-space send-prefix
#-vi keys in copy mode
set -gq mode-keys vi

#==ui
source -F "#{d:current_file}/colors.conf"

#--status
set -gq status-interval 60
set -gq status-justify left
set -gq status-left " #S#{?client_prefix,›, }"
set -gq status-position top
set -gq status-right " #{?window_bigger,[#{window_offset_x}#,#{window_offset_y}] | }BAT:#(. \${TJMDOT:-~/.dotfiles}/sh/env.sh && os batterylevel) | %m/%d %H:%M "
set -gFq status-style "bg=##{?client_prefix,#{@c1},#{@c2Alt}},fg=##{?client_prefix,#{@c1Alt},#{@c2}}"
set -gFq window-status-style "bg=#{@c4Alt},fg=#{@c4}"
set -gq window-status-current-format "#{E:window-status-format}"
set -gFq window-status-current-style "bg=#{@c1},fg=#{@c1Alt}"
set -gq window-status-format " #I #{?#{==:#{window_name},#{pane_current_command}},#{b:pane_current_path},#{window_name}}#{?window_flags,#{window_flags},·} "
set -gq window-status-separator ""

#--windows
#-don't auto rename windows with last command so we can manually name them
set -gq allow-rename off
#-start windows / panes at one for easier switching
set -gq base-index 1
setw -gq pane-base-index 1

#--panes
set -gFq window-style "bg=#{@c0DimAlt},fg=#{@c0Dim}"
set -gFq window-active-style "bg=#{@c0Alt},fg=#{@c0}"
set -gq pane-border-status top
#-! #{pane_title}
set -gq pane-border-format "#{pane_index} #{pane_current_command}@#{=/-30/…:pane_current_path}─#{?#{pane_mode}, #[bold][#{pane_mode}]#[default]}#{?#{mouse},#[align=right]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}"
set -gFq pane-border-style "bg=#{@c4Alt},fg=#{@c4}"
set -gFq pane-active-border-style "bg=#{@c1},fg=#{@c1Alt}"
set -gFq mode-style "bg=#{@c1},fg=#{@c1Alt}"

#--message
set -gFq message-command-style "bg=#{@c3Alt},fg=#{@c3},fill=#{@c3Alt}"
set -gFq message-style "bg=#{@c1Alt},fg=#{@c1Emph},fill=#{@c1Alt}"
set -gq message-format " #S› #[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}"

#--clock
set -gFq clock-mode-color "#{@c1}"

#==keys
#--improve copy paste experience
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe
#-don't like auto-copy on drag end
unbind -T copy-mode-vi MouseDragEnd1Pane
#--easier exit of copy mode
bind-key -T copy-mode-vi Escape if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X cancel'
#--exit copy mode on click, if pane is active with selection
unbind -T copy-mode-vi MouseDown1Pane
bind -T copy-mode-vi MouseDown1Pane if-shell -Ft= '#{&&:#{pane_active},#{selection_present}}' 'send-keys -X cancel' 'select-pane -t ='
#--panes
bind | split-window -h
bind - split-window -v

#==ux
set -gq mouse on
#-message display time
set -gq display-time 0
#-use OS clipboard
set -s set-clipboard external
run-shell -E '. ${TJMDOT:-~/.dotfiles}/sh/env.sh && tmux set -gq copy-command "$(os copy-command)"'
